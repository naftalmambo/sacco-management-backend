services:
  db:
    image: postgres:14-alpine
    container_name: sacco-postgres
    environment:
      POSTGRES_DB: sacco_management_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sacco_dev_pass}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d sacco_management_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: sacco-backend
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/sacco_management_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-sacco_dev_pass}
      JAVA_TOOL_OPTIONS: "-Xmx512m"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
