# 💾 PostgreSQL Core Database Driver Stream Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/sacco_management_db
spring.datasource.username=sacco_admin
spring.datasource.password=mamboSecure2012
spring.datasource.driver-class-name=org.postgresql.Driver

# 🌐 Web Server Protocol and Network Communication Layout
server.port=8080

# 📊 Data Persistence Lifecycle and SQL Auditing Logs
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.hibernate.orm.queries=info

spring.jpa.open-in-view=false

spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyHbmImpl


